name: Daily video factory

on:
  schedule:
    - cron: '0 5 * * *' # every day at 05:00 UTC
  workflow_dispatch:
    inputs:
      videos:
        description: 'How many videos to make'
        default: '5'
      dry_run:
        description: 'Only render, do not upload or schedule'
        type: boolean
        default: false

permissions:
  contents: write # lets the job save the list of recent topics

concurrency:
  group: video-factory
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install libraries that Chrome needs
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libgbm-dev libpango-1.0-0 libcairo2 libcups2

      - run: npm ci

      - name: Check the script rules
        run: npm test

      - name: Generate the background music
        run: npm run music

      - name: Make and schedule the videos
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          APP_URL: ${{ secrets.APP_URL }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          VIDEOS_PER_RUN: ${{ inputs.videos || vars.VIDEOS_PER_RUN || '5' }}
          DRY_RUN: ${{ inputs.dry_run }}
          PLATFORMS: ${{ vars.PLATFORMS || 'youtube,tiktok' }}
          BRAND: ${{ vars.BRAND || 'Zeecomedia Tech' }}
          CTA: ${{ vars.CTA || 'Follow for daily coding tips' }}
          YT_TREND_REGION: ${{ vars.YT_TREND_REGION || 'US' }}
        run: npm run factory

      - name: Remember today's topics
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "video-factory"
          git config user.email "video-factory@users.noreply.github.com"
          git add data/history.json
          git diff --cached --quiet || (git commit -m "Update topic history" && git push)

      - name: Keep the rendered videos (dry runs only)
        if: ${{ inputs.dry_run == true }}
        uses: actions/upload-artifact@v4
        with:
          name: rendered-videos
          path: out/videos
          retention-days: 3
